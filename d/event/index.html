<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#111827;
  --ink2:#6b7280;
  --ink3:#d1d5db;
  --muted:#9ca3af;
  --bg-soft:#f9fafb;
  --accent:#3b82f6;
  --accent-ink:#ffffff;
  --line:#e5e7eb;
  --line-strong:#d1d5db;
  --card:#ffffff;
  --radius:12px;
}

.page{
  position:relative;z-index:2;
  max-width:720px;margin:0 auto;
  padding:0 0 80px;
}

.site-header{
  position:fixed;top:0;left:0;width:100%;z-index:100;
  border-bottom:1px solid var(--line);
  background:var(--bg-soft);
}
.container header-inner{
  max-width:1280px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
}
.brand{
  font-family:var(--serif);font-size:15px;color:var(--ink);text-decoration:none;transition:color .2s;
}
.brand:hover{color:var(--accent);}

.site-nav a{
  margin-left:24px;font-size:14px;color:var(--ink2);text-decoration:none;position:relative;
}
.site-nav a::after{
  content:'';position:absolute;bottom:-4px;width:0;height:2px;background:var(--accent);transition:width .2s;
}
.site-nav a:hover::after{width:100%;}

/* ── ヒーロー ── */
.hero{
  padding:72px 0 10px;
  text-align:center;
}
.hero-cols{
  grid-template-columns:1fr;
  gap:28px;
}
.hero-eyebrow{
  font-size:10px;letter-spacing:0.28em;color:var(--muted);margin-bottom:22px;
}
.hero-title{
  font-family:var(--serif);font-size:clamp(32px,5vw,46px);font-weight:500;margin:0 0 14px;
}
.hero-sub{
  color:var(--ink-2);margin:0 0 8px;max-width:62ch;
}

/* ── イベント一覧 ── */
.works-list{
  margin-top:80px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;
}
.work-item{
  display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);
  gap:28px;padding:26px 4px;
  border-bottom:1px solid var(--line);
  transition:background .2s ease;
}
.work-item:hover{background:var(--bg-soft);}

.item-tags{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  margin:0 0 8px;padding:0;
}
.item-tags span{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;color:var(--muted);background:var(--bg-soft);border-radius:999px;padding:3px 10px;
}
.item-tags .cat-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

.work-name{
  font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.5;margin:0;
}
.work-name a{color:var(--ink);}
.work-name a:hover{color:var(--accent-ink);}
.work-name .en{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--muted);margin-top:3px;}

.work-body p { margin: 0 0 10px; font-size: 14.5px; color: var(--ink-2); }
.work-caption { font-size: 12.5px; color: var(--muted); }

.work-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13.5px; font-weight: 500;
}
.work-link::after { content: '↗'; font-size: 12px; }

/* ── ルーレット型 Welcome ── */
.welcome-section{
  margin:0 36px;
  border:1px solid var(--line);border-top:none;
  background:var(--card);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:28px 32px 26px;
}
.welcome-eyebrow{
  font-size:10px;letter-spacing:0.22em;color:var(--muted);margin-bottom:20px;
}
.welcome-roulette{
  display:flex;align-items:center;gap:0;
  font-family:'Noto Serif JP',serif;font-weight:300;
  font-size:clamp(14px,2.4vw,18px);
  letter-spacing:0.06em;color:var(--muted);
  line-height:1;
}
.welcome-static{white-space:nowrap;color:var(--muted)}
.welcome-slot{
  display:inline-block;
  overflow:hidden;
  height:2.2em;
  min-width:11em;
  vertical-align:middle;
  margin:0 8px;
  position:relative;
}
.welcome-slot::before,
.welcome-slot::after{
  content:'';position:absolute;left:0;right:0;z-index:2;height:25%;
  pointer-events:none;
}
.welcome-slot::before{
  top:0;
  background:linear-gradient(to bottom, var(--card) 0%, transparent 100%);
}
.welcome-slot::after{
  bottom:0;
  background:linear-gradient(to top, var(--card) 0%, transparent 100%);
}
.welcome-drum{
  display:flex;flex-direction:column;
}
.welcome-item{
  height:2.2em;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  white-space:nowrap;
  color:var(--ink);
  font-family:'Noto Serif JP',serif;
  flex-shrink:0;
}

/* ── フィーチャー ── */
.features-wrap{
  margin:0 36px;
  border:1px solid var(--line);border-top:none;
  background:var(--card);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.feat-row{display:grid;grid-template-columns:1fr 1fr}
.feat{padding:24px 26px}
.feat:first-child{border-right:1px solid var(--line)}
.feat-row+.feat-row .feat{border-top:1px solid var(--line)}
.feat-row+.feat-row .feat:first-child{border-right:1px solid var(--line)}
.feat-no{font-size:10px;letter-spacing:0.12em;color:var(--muted);margin-bottom:10px}
.feat-name{
  font-family:'Noto Serif JP',serif;font-weight:300;
  font-size:13px;letter-spacing:0.06em;color:var(--ink);line-height:1.65;margin-bottom:7px;
}
.feat-desc{font-size:11.5px;color:var(--muted);line-height:1.9;letter-spacing:0.04em}

/* ── タグ / 宣伝 ── */
.sub-row{
  display:flex;align-items:center;justify-content:space-between;
  margin:0 36px;padding:20px 26px;
  border:1px solid var(--line);border-top:none;
  background:var(--card);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.tag-label{font-size:10px;letter-spacing:0.2em;color:var(--muted)}
.tag-pill{
  font-family:'Noto Serif JP',serif;font-weight:300;
  font-size:12px;letter-spacing:0.14em;color:var(--muted);
  padding:4px 14px;border:1px solid var(--line);
}
.ad-note{font-size:10px;color:var(--muted);letter-spacing:0.06em}

/* ── イベント ── */
.event-section{
  margin:28px 36px 0;
  border:1px solid var(--line);
  background:var(--card);
}
.event-header{
  padding:18px 26px 14px;border-bottom:1px solid var(--line);
}
.event-eyebrow{font-size:10px;letter-spacing:0.22em;color:var(--muted);margin-bottom:6px}
.event-title{
  font-family:'Noto Serif JP',serif;font-weight:300;
  font-size:15px;letter-spacing:0.08em;color:var(--ink);
}
.event-body{
  display:flex;align-items:center;gap:16px;
  padding:20px 26px;text-decoration:none;transition:background .2s;
}
.event-body:hover{background:rgba(0,0,0,0.02)}
.event-icon{
  flex-shrink:0;width:42px;height:42px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:rgba(0,0,0,0.04);color:var(--muted);
}
.event-icon svg{width:21px;height:21px;opacity:.82}
.event-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.event-name{font-size:12px;letter-spacing:0.06em;color:var(--ink)}
.event-desc{font-size:12px;letter-spacing:0.04em;color:var(--muted);line-height:1.6}
.event-action{font-size:10px;letter-spacing:0.1em;color:var(--muted);flex-shrink:0;white-space:nowrap}

/* ── フッター ── */
.site-footer{
  margin-top:84px;border-top:1px solid var(--line);
}
.footer-inner{
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;flex-wrap:wrap;padding:26px 0 8px;
}
.footer-brand{
  font-family:var(--serif);font-size:15px;
}
.footer-links{
  display:flex;flex-wrap:wrap;gap:4px 18px;
}
.footer-links a{
  font-size:13px;color:var(--ink2);
}
.footer-links a:hover{
  color:var(--accent-ink);
}
.footer-copy{
  font-size:11.5px;color:var(--muted);padding-bottom:30px;
}

/* ── 背景ドット ── */
.bg-dots{
  position:fixed;bottom:22px;right:26px;z-index:10;
  display:flex;gap:7px;align-items:center;
}
.bg-dot{
  width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,0.18);
  border:0.5px solid rgba(255,255,255,0.28);
  cursor:none;transition:background .3s,transform .2s;
}
.bg-dot.active{background:rgba(255,255,255,0.80);transform:scale(1.2)}

.foot-small{
  margin:28px 0 0;
  font-size:10px;color:var(--muted);
}

/* ── レスポンシブ ── */
@media (max-width:880px){
  .hero-cols { grid-template-columns: 1fr; gap: 28px; }
  .work-item { grid-template-columns: 1fr; gap: 12px; }
  .features-wrap,.sub-row,.review-section,.event-section,.bot-section,.news-section,.foot{margin-left:20px;margin-right:20px}
  .welcome-roulette{flex-direction:column;align-items:flex-start;gap:4px}
  .welcome-slot{min-width:0;width:100%;margin:4px 0}
  .feat-row{grid-template-columns:1fr}
  .feat:first-child{border-right:none;border-bottom:1px solid var(--line)}
  .sub-row{flex-direction:column;align-items:flex-start;gap:10px}
  .review-links{grid-template-columns:1fr}
  .review-link-item{border-right:none;border-bottom:1px solid var(--line)}
  .review-link-item:last-child{border-bottom:none}
}
@media (max-width:620px){
  body { font-size: 15px; }
  .container { width: min(100% - 32px, var(--maxw)); }
}

/* ── タッチ端末ではカスタムカーソルを無効化 ── */
@media (hover:none),(pointer:coarse){
  html,body{cursor:auto}
  #cursor{display:none}
}

/* ── 視差効果を減らす設定の尊重 ── */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  /* 花びら・ローダーは reduced-motion でも動かす（ユーザー要望） */
  .petal{animation-duration:var(--pdur,1500ms)!important;animation-iteration-count:1!important}
  .loader{transition-duration:.8s!important}
  .loader-bar i{animation-duration:1.15s!important;animation-iteration-count:infinite!important}
}

/* ── ペットルアニメ ── */

/* ── ローディング ── */
<script>
(function(){
  const l=document.getElementById('loader'); if(!l) return;
  let hidden=false;
  function hide(){ if(hidden) return; hidden=true; l.classList.add('done'); setTimeout(()=>l.remove(),900); }
  const first=new Image(); first.onload=()=>setTimeout(hide,250); first.onerror=hide; first.src='../portfolio/assets/img/og.png';
  window.addEventListener('load',()=>setTimeout(hide,250));
  setTimeout(hide,4000); /* フォールバック */
})();
</script>
